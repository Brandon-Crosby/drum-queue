name: Audio export regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 fastapi==0.165.0 python-multipart==0.0.20 mutagen==1.47.0
      - run: python -m unittest discover -s tests -v
      - run: python tools/zone-six/test_build.py -v
      - run: python tools/zone-six/test_watch.py -v

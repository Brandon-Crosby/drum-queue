# Satyr: a Band-Split RoFormer (BS-RoFormer) for stage 2 (Demucs' drum stem -> drums), trained from zero
# on the same data as Helyx (train/NEXT_RUN.md, 'Satyr plan'). Model section: MSST's own public
# configs/config_musdb18_bs_roformer.yaml (62 bands) with depth 12 and our 7 outputs. Augmentations and the
# rest: same as Helyx (config_drumsplit.yaml). Clean-room: public paper/code defaults + our data only.
audio:
  chunk_size: 131584     # MSST's BS-RoFormer default (257 x hop 512)
  dim_f: 1024
  dim_t: 256
  hop_length: 512
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.0      # allow silent stems in a chunk: most beats have no toms or cymbals

model:
  dim: 192
  depth: 12             # the published BS-RoFormer depth (Lu et al. 2023); fallback 6 if too costly
  stereo: true
  num_stems: 7           # kick snare toms hh cymbals perc other
  time_transformer_depth: 1
  freq_transformer_depth: 1
  linear_transformer_depth: 0
  freqs_per_bands: !!python/tuple
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 12
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 24
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 128
    - 129
  dim_head: 64
  heads: 8
  attn_dropout: 0.1
  ff_dropout: 0.1
  flash_attn: true
  dim_freqs_in: 1025
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: False
  mlp_expansion_factor: 4 # Probably too big (requires a lot of memory for weights)
  use_torch_checkpoint: False  # it allows to greatly reduce GPU memory consumption during training (not fully tested)
  skip_connection: False # Enable skip connection between transformer blocks - can solve problem with gradients and probably faster training

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
  - kick
  - snare
  - toms
  - hh
  - cymbals
  - perc
  - other
  lr: 5.0e-05            # MSST's from-scratch rate
  patience: 2
  reduce_factor: 0.95
  target_instrument: null
  num_epochs: 1000       # overwritten by modal_train.py (we stop on time)
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adam
  other_fix: false
  use_amp: true

augmentations:
  enable: true
  # helyx-4 (train/mixaug.py, patched into MSST by msst_patch.py):
  aligned_prob: 0.5      # half the mixes are one song's stems as the producer placed them (real grooves,
                         # real stacking) instead of stems from different songs
  restack_prob: 0.5      # lay the snare's main hit on some kicks, half the time darkened (helyx-5: 0.3 -> 0.5)
  darken_prob: 0.3      # low-pass the snare stem: dark snares on their own (helyx-4 sent hasta luego's to the kick)
  onbeat_prob: 0.3      # synth/vox/808 chops laid on the snare hits, kept in 'other' (stunyun137)
  nokick_prob: 0.1      # some clips with no kick at all (808-led beats)
  quiethats_prob: 0.25  # hats/shakers 12-30 dB under the other drums (church's chicken: helyx-6 filed them as perc)
  layerkick_prob: 0.3   # kicks with a knock/click layer on top, all kick (helyx kicks lose their 300 Hz+ body)
  noisebed_prob: 0.3    # hiss/tape/vinyl/room/hum 25-45 dB under the mix, all 'other' (helyx-8: no hiss in the stems)
  master_prob: 0.5       # master chain on the whole mix: EQ, bus comp, 4-14 dB into a limiter, clipper
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs: !!python/tuple
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5
  all:
    channel_shuffle: 0.5
    random_inverse: 0.01
    random_polarity: 0.5
    pitch_shift: 0.1
    pitch_shift_min_semitones: -3
    pitch_shift_max_semitones: 3
    seven_band_parametric_eq: 0.5
    seven_band_parametric_eq_min_gain_db: -6
    seven_band_parametric_eq_max_gain_db: 6
    tanh_distortion: 0.2
    tanh_distortion_min: 0.1
    tanh_distortion_max: 0.5

inference:
  batch_size: 1
  dim_t: 256
  num_overlap: 4
